# dsh-101 reader: bind on port 3081 by default so it can run alongside the
# default web profile's GUI on 3080; override at launch with
#   dsh --profile dsh-101 --port <n>
# (the launch flag wins; 3081 is the fallback).
- id: webserver
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3081
